seed: 23
save_dir: first_run

data:
  path: /project2/cdonnat/sleepstages/data/pt/non_overlapping_data.pt
  batch_size: 24
  num_workers: 4
  split: [0.6, 0.20, 0.20]
  augment:
    strategy: upsample
    proportion: 0.6
  edge:
    tsh: null
    top: 0.10

models:
  - name: gnn_sage
    architecture: gnn
    params:
      input_dim: 347
      hidden_channels: 64
      num_layers: 3
      dropout: 0.5
      edge_dropout: 0.1
      num_classes: 4
      mlp_hidden: [64, 32]
      lr: 2.3e-3
      wd: 1.0e-3
      gnn_layer: SAGEConv
      pooling_fn: sort
      residual_connections: true
      loss_type: cross_entropy
    trainer:
      max_epochs: 50
      accelerator: gpu
      devices: 1
      log_every_n_steps: 5

  - name: mlp_baseline
    architecture: mlp
    params:
      input_dim: 294
      hidden_dims: [256, 128, 64]
      dropout: 0.3
      num_classes: 4
      lr: 1.0e-3
      loss_type: cross_entropy
    trainer:
      max_epochs: 40
      accelerator: auto
      devices: 1

  - name: logistic_reg
    architecture: logistic
    params:
      input_dim: 294
      num_classes: 4
      lr: 5.0e-3
      loss_type: weighted_cross_entropy
    trainer:
      max_epochs: 20
      accelerator: auto
      devices: 1