seed: 23
save_dir: first_run

# -----------------------------------------------------------------------------
# Data settings (shared by every model run)
# -----------------------------------------------------------------------------

data:
  path: /project2/cdonnat/sleepstages/data/pt/non_overlapping_data.pt
  batch_size: 32
  num_workers: 4
  split: [0.6, 0.20, 0.20]   # [train, val, test]
  augment:
    strategy: upsample        # {upsample, interpolate, geodesic, null}
    proportion: 0.6           # only used if strategy != null
  edge:
    tsh: null                 # correlation threshold (for fully-connected to sparse)
    top: 0.10                 # top-k proportion of edges to keep              # {corr, coherence, ...}

# -----------------------------------------------------------------------------
# Define *any* number of models to train sequentially
# Each entry must have:
#   name         – unique identifier for logging / checkpoints
#   architecture – one of {gnn, mlp, logistic} OR a dotted-path import string
#   params       – constructor kwargs for the model class
#   trainer      – PyTorch-Lightning Trainer kwargs (optional; overrides global)
# -----------------------------------------------------------------------------

models:
  # --- 1. Graph Neural Network ------------------------------------------------
  - name: gnn_sage
    architecture: gnn              # mapped to static_models.gnn.LightningGNN
    params:
      input_dim: 347
      hidden_channels: 64
      num_layers: 3
      dropout: 0.5
      edge_dropout: 0.1
      num_classes: 4
      mlp_hidden: [64, 32]
      lr: 2.3e-3
      wd: 1.0e-3
      gnn_layer: SAGEConv          # looked up in torch_geometric.nn
      pooling_fn: sort
      residual_connections: true
      loss_type: cross_entropy
    trainer:
      max_epochs: 50
      accelerator: gpu
      devices: 1
      log_every_n_steps: 5

  # --- 2. Multilayer Perceptron ----------------------------------------------
  - name: mlp_baseline
    architecture: mlp              # mapped to static_models.mlp.LightningMLP
    params:
      input_dim: 294
      hidden_dims: [256, 128, 64]
      dropout: 0.3
      num_classes: 4
      lr: 1.0e-3
      loss_type: cross_entropy
    trainer:
      max_epochs: 40
      accelerator: auto
      devices: 1

  # --- 3. Logistic Regression -------------------------------------------------
  - name: logistic_reg
    architecture: logistic         # mapped to static_models.logistic.LightningLogisticRegression
    params:
      input_dim: 294
      num_classes: 4
      lr: 5.0e-3
      loss_type: weighted_cross_entropy
    trainer:
      max_epochs: 20
      accelerator: auto
      devices: 1