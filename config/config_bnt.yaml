seed: 7
save_dir: runs  # Change this to your desired output directory

data:
  path: data/your_dataset.pt  # Change this to your data file path
  batch_size: 32
  num_workers: 4
  split: [0.6, 0.3, 0.1]
  augment:
    strategy: null
    proportion: null

models:
  - name: bnt_baseline
    architecture: bnt
    params:
      input_dim: 347         
      num_classes: 4          
      n_layers: 2             
      n_heads: 1              
      n_clusters: 24           
      lr: 0.0001              
      wd: 0.0001              
      loss_type: weighted_cross_entropy
    trainer:
      max_epochs: 50
      accelerator: auto
      devices: 2
      log_every_n_steps: 10 