[project]
name = "graphs-fmri-analysis"
version = "0.1.0"
description = "Graph-based fMRI classification pipeline"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["data*", "static_models*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
